<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 700px;">

        <h1 class="text-center mb-5">{{restaurant_name}}</h1>

        {% for category in menu.values() %}
        <section class="mb-5">
            <h2 class="h4 text-uppercase border-bottom pb-2 mb-3">{{category["name"]}}</h2>


            {% for product_name, value in category["products"].items() %}
            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <span class="fw-semibold">{{ product_name }}</span>
                    <span class="fw-semibold">{{ value["price"] }}</span>
                </div>
                <p class="text-muted small mb-0">{{ value["description"] }}</p>
            </div>
            {% endfor %}
        </section>

        {% endfor %}

    </div>

    <button onclick="window.print()" class="btn btn-primary d-print-none">Download PDF</button>

</body>
</html>
