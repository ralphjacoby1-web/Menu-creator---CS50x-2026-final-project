<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu Creator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">
                <img src="/static/images/logo_menu_creator.png" alt="Logo" width="30" height="24"
                    class="d-inline-block align-text-top me-1">
                Menu Creator
            </a>
        </div>
    </nav>

    <main class="flex-grow-1">
        <div class="container py-5" style="max-width: 750px;">

            <h1 class="mb-1">Create your menu</h1>
            <p class="text-muted mb-4">Add your categories and products, then generate the menu.</p>

            <form action="/" method="POST">

                <div class="card mb-4">
                    <div class="card-body">
                        <label class="form-label fw-semibold">Restaurant name</label>
                        <input name="restaurant-name" class="form-control" placeholder="Restaurant name" required>
                    </div>
                </div>

                <h2 class="h5 mb-3">Categories</h2>

                <div id="categories"></div>

                <div class="d-flex justify-content-between mt-3">
                    <button type="button" id="add-category" class="btn btn-outline-primary">+ Add category</button>
                    <button type="submit" class="btn btn-primary">Generate menu</button>
                </div>

            </form>

        </div>
    </main>

    <footer class="bg-white border-top py-3">
        <div class="container text-center text-muted small">
            Ralph Jacoby
        </div>
    </footer>

    <!-- Template are used to allow adding more without needing unlimited lines of HTML.-->

    <template id="category-template">
        <div class="category card mb-3">
            <div class="card-body">

                <input type="hidden" name="category_key">

                <div class="d-flex gap-2 mb-3">
                    <input name="category-name" class="form-control fw-semibold" placeholder="Category name" required>
                    <button type="button" class="remove-category btn btn-outline-danger">Delete</button>
                </div>

                <div class="products"></div>

                <button type="button" class="add-product btn btn-sm btn-outline-secondary">+ Add product</button>

            </div>
        </div>
    </template>

    <template id="product-template">
        <div class="product border rounded p-3 mb-3 bg-light">

            <input type="hidden" name="product-category">

            <div class="row g-2 mb-2">
                <div class="col-8">
                    <input name="product-name" class="form-control" placeholder="Product name" required>
                </div>
                <div class="col-4">
                    <input name="product-price" type="number" step="0.01" min="0" class="form-control" placeholder="Price" required>
                </div>
            </div>

            <textarea name="product-description" class="form-control mb-2" placeholder="Description (optional)" rows="2"></textarea>

            <div class="text-end">
                <button type="button" class="delete-product btn btn-sm btn-link text-danger">Delete product</button>
            </div>

        </div>
    </template>

    <script src="/static/script.js"></script>
</body>

</html>
